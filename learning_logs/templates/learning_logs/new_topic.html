
{% extends "learning_logs/base.html" %}

{% block content %}
<h2>Новая тема</h2>

<form method="post">
    {% csrf_token %}

    <p>
        <label for="name">Название темы:</label>
        <input type="text" id="name" name="name" maxlength="200" required>
    </p>

    <button type="submit">Добавить тему</button>
</form>

<p><a href="{% url 'index' %}">Вернуться на главную</a></p>
{% endblock %}
