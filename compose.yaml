services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - db_data:/app/data
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec gunicorn learning_log.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 1 \
          --threads 4 \
          --timeout 60
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db_data: